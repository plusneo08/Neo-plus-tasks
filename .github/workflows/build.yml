
name: NEO PLUS AI - Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neo-plus-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NEO PLUS AI APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Android SDK
      - name: Install Android SDK
        shell: bash
        run: |
          set -eu

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK Manager not found"
            exit 1
          fi

          echo "Accepting Android SDK licences..."

          yes | "$SDKMANAGER" --licenses

          echo "Installing Android SDK packages..."

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "Android SDK installation completed."

      # 4. Configure Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 5. Verify project structure
      - name: Verify Android project
        shell: bash
        run: |
          echo "Checking project files..."
          ls -la

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          echo "Project structure verified."

      # 6. Build APK
      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      # 7. Upload APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NEO-PLUS-AI-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # 8. Build success report
      - name: Build Summary
        if: success()
        run: |
          echo "NEO PLUS AI BUILD SUCCESSFUL!"
          echo "APK generated and uploaded."
          
