
name: NEO PLUS AI - Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neo-plus-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NEO PLUS AI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK Manager
        id: sdk
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK Manager not found"
            exit 1
          fi

          echo "path=$SDKMANAGER" >> "$GITHUB_OUTPUT"

      - name: Accept Android SDK Licences
        shell: bash
        run: |
          set -e
          yes | "${{ steps.sdk.outputs.path }}" --licenses

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e

          "${{ steps.sdk.outputs.path }}" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Verify Project Structure
        shell: bash
        run: |
          set -e

          echo "Repository files:"
          ls -la

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          echo "Project structure verified."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Gradle Configuration
        run: gradle tasks --no-daemon --stacktrace

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEO-PLUS-AI-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Success Report
        if: success()
        run: echo "NEO PLUS AI APK built successfully!"
        
